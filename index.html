
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>My Money 记账</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px}
h1{font-size:26px}
.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 12px #00000008}
.total{font-size:30px;font-weight:bold}
small{color:#888}
input,select,button{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;background:white}
button{background:#222;color:white;border:0;font-weight:bold}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.income{color:#159768}.expense{color:#dc5555}
nav{display:flex;gap:8px}
nav button{font-size:13px;padding:10px 4px}
</style>
</head>
<body>
<h1>My Money 💰</h1>
<small>简单记录 · 好好管理每一分钱</small>

<div class="card">
<small>本月结余</small>
<div class="total" id="balance">RM 0.00</div>
<div class="item"><span>收入</span><b class="income" id="income">RM 0.00</b></div>
<div class="item"><span>支出</span><b class="expense" id="expense">RM 0.00</b></div>
</div>

<nav>
<button onclick="show('record')">记账</button>
<button onclick="show('stats')">统计</button>
<button onclick="show('budget')">预算</button>
</nav>

<section id="record">
<div class="card">
<h3>新增记录</h3>
<select id="type">
<option value="expense">支出</option>
<option value="income">收入</option>
</select>
<input id="amount" type="number" placeholder="金额 RM" step="0.01">
<select id="category">
<option>食物</option><option>交通</option><option>购物</option>
<option>账单</option><option>娱乐</option><option>医疗</option>
<option>工资</option><option>其他</option>
</select>
<input id="note" placeholder="备注（可不填）">
<label>日期</label>
<input id="date" type="date">
<label><input id="credit" type="checkbox" style="width:auto"> 信用卡消费</label>
<button onclick="add()">保存记录</button>
</div>
<div class="card">
<h3>记录明细</h3>
<div id="list"></div>
</div>
</section>

<section id="stats" style="display:none">
<div class="card">
<h3>本月统计</h3>
<div id="statistics"></div>
</div>
</section>

<section id="budget" style="display:none">
<div class="card">
<h3>每月预算</h3>
<input id="budgetAmount" type="number" placeholder="设定预算 RM">
<button onclick="saveBudget()">保存预算</button>
<div id="budgetInfo"></div>
</div>
<div class="card">
<h3>信用卡消费</h3>
<div id="creditInfo"></div>
</div>
<div class="card">
<h3>数据备份</h3>
<button onclick="exportData()">导出备份</button>
<input type="file" id="importFile" accept=".json">
<button onclick="importData()">导入备份</button>
</div>
</section>

<script>
let records=JSON.parse(localStorage.getItem('moneyRecords')||'[]');
let budget=Number(localStorage.getItem('moneyBudget')||0);
const money=n=>'RM '+Number(n).toFixed(2);
const thisMonth=()=>new Date().toISOString().slice(0,7);
document.getElementById('date').value=new Date().toISOString().slice(0,10);

function save(){localStorage.setItem('moneyRecords',JSON.stringify(records));render()}
function add(){
let amount=Number(document.getElementById('amount').value);
if(!amount||amount<=0){alert('请输入正确金额');return}
records.unshift({
type:document.getElementById('type').value,
amount,
category:document.getElementById('category').value,
note:document.getElementById('note').value,
date:document.getElementById('date').value,
credit:document.getElementById('credit').checked
});
save();
document.getElementById('amount').value='';
document.getElementById('note').value='';
document.getElementById('credit').checked=false;
}
function render(){
let month=records.filter(r=>r.date&&r.date.slice(0,7)===thisMonth());
let inc=month.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
let exp=month.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
document.getElementById('income').textContent=money(inc);
document.getElementById('expense').textContent=money(exp);
document.getElementById('balance').textContent=money(inc-exp);
document.getElementById('list').innerHTML=records.map((r,i)=>
`<div class="item"><div>${r.category}${r.credit?' 💳':''}<br><small>${r.date} ${r.note||''}</small></div><div class="${r.type}">${r.type==='income'?'+':'-'}${money(r.amount)}<br><small onclick="del(${i})">删除</small></div></div>`
).join('')||'还没有记录';
let cats={};
month.filter(r=>r.type==='expense').forEach(r=>cats[r.category]=(cats[r.category]||0)+r.amount);
document.getElementById('statistics').innerHTML=
'本月收入：'+money(inc)+'<br>本月支出：'+money(exp)+'<hr>'+
Object.entries(cats).map(([k,v])=>k+'：'+money(v)).join('<br>');
document.getElementById('budgetInfo').textContent=
budget?'预算：'+money(budget)+'｜已用：'+money(exp)+'｜剩余：'+money(budget-exp):'还没设定预算';
if(budget&&exp>budget)document.getElementById('budgetInfo').textContent+=' ⚠️ 已超出预算！';
document.getElementById('creditInfo').textContent=money(month.filter(r=>r.credit&&r.type==='expense').reduce((s,r)=>s+r.amount,0));
}
function del(i){if(confirm('确定删除这笔记录？')){records.splice(i,1);save()}}
function show(id){['record','stats','budget'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none')}
function saveBudget(){budget=Number(document.getElementById('budgetAmount').value);localStorage.setItem('moneyBudget',budget);render()}
function exportData(){
let blob=new Blob([JSON.stringify({records,budget})],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-backup.json';a.click();
}
function importData(){
let f=document.getElementById('importFile').files[0];if(!f)return alert('请选择备份文件');
let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);records=d.records||[];budget=d.budget||0;localStorage.setItem('moneyBudget',budget);save();alert('导入成功')}catch(e){alert('文件格式不正确')}};reader.readAsText(f);
}
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script>
</body>
</html>
