<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Money">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>My Money · 个人记账</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#242522;--muted:#85877f;--line:#e9e9e4;--accent:#343a35;--soft:#eff1ed;--green:#66846e;--red:#b66d66}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(22px + env(safe-area-inset-bottom));max-width:650px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 14px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted)}h1{font-size:23px;margin:5px 0 0;font-weight:650}.date{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0}.hero{background:#eef0ec}.label{font-size:12px;color:var(--muted)}.big{font-size:32px;font-weight:650;letter-spacing:-1px;margin:7px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat strong{display:block;margin-top:5px;font-size:16px}.green{color:var(--green)}.red{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}button{font:inherit;border:1px solid var(--line);background:white;color:var(--ink);border-radius:12px;padding:12px;cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:active{opacity:.75}
.tabs{display:flex;gap:5px;background:#edeee9;padding:4px;border-radius:13px;margin:14px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px 3px;font-size:12px}.tabs button.active{background:white;box-shadow:0 1px 4px #0000000c}
h2{font-size:15px;margin:0 0 13px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.amount{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}.hidden{display:none!important}
input,select{width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:12px;font:inherit;color:var(--ink);margin:5px 0 11px;min-width:0}label{font-size:12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:8px;background:#eceee9;border-radius:10px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--green);border-radius:10px}
.chart{height:145px;display:flex;align-items:end;justify-content:center;gap:42px;padding:10px}.chartcol{display:flex;align-items:center;flex-direction:column;justify-content:end;height:100%;gap:6px;font-size:11px;color:var(--muted)}.bars{display:flex;align-items:end;gap:5px;height:95px}.baritem{width:25px;border-radius:6px 6px 2px 2px;min-height:3px}.incomeBar{background:#8ca38f}.expenseBar{background:#c88d85}
.categoryline{margin:12px 0}.categoryline .row{padding:4px 0;border:0;font-size:13px}
footer{display:flex;justify-content:space-between;align-items:center;margin:20px 2px;font-size:11px;color:var(--muted)}.smallbtn{font-size:12px;padding:8px 10px}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:end;justify-content:center;padding:12px;z-index:5}.sheet{background:var(--bg);width:100%;max-width:620px;border-radius:22px 22px 15px 15px;padding:20px;max-height:90vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.typepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.typepick button.selected{background:var(--soft);border-color:#aab3a8}
.notice{font-size:12px;color:var(--muted);min-height:18px;text-align:center;margin-top:9px}
</style></head>
<body>
<header><div><div class="eyebrow">PERSONAL FINANCE</div><h1>My Money.</h1></div><div class="date" id="today"></div></header>
<section class="card hero"><div class="row" style="border:0;padding:0"><span class="label">本月结余</span><select id="month" style="width:auto;margin:0;padding:7px 9px;font-size:12px"></select></div><div class="big" id="balance">RM 0.00</div><div class="stats"><div class="stat"><span class="label">收入</span><strong class="green" id="income">RM 0.00</strong></div><div class="stat"><span class="label">支出</span><strong class="red" id="expense">RM 0.00</strong></div></div></section>
<div class="actions"><button class="primary" id="newExpense">＋ 记录支出</button><button id="newIncome">＋ 记录收入</button></div>
<nav class="tabs"><button class="active" data-tab="home">总览</button><button data-tab="list">明细</button><button data-tab="budget">预算</button><button data-tab="cards">信用卡</button></nav>
<section id="home">
 <div class="card"><h2>本月收支</h2><div class="chart" id="chart"></div><div class="muted" style="font-size:11px;text-align:center">收入　　支出</div></div>
 <div class="card"><h2>支出分类</h2><div id="categories" class="muted" style="font-size:13px">还没有记录</div></div>
 <div class="card"><h2>最近记录</h2><div id="recent" class="muted" style="font-size:13px">暂无记录</div></div>
</section>
<section id="list" class="hidden"><div class="card"><h2>交易明细 <span class="muted" id="count" style="font-size:11px;font-weight:400"></span></h2><div id="records"></div></div></section>
<section id="budget" class="hidden">
 <div class="card"><h2>每月总预算</h2><label>预算金额（RM）</label><input id="totalBudget" type="number" min="0" step=".01" placeholder="例如 1500"><button class="primary" id="saveTotal">保存总预算</button><p class="muted" id="budgetInfo" style="font-size:12px"></p><div class="bar"><span id="totalBar" style="width:0%"></span></div></div>
 <div class="card"><h2>分类预算</h2><div id="budgetCats"></div></div>
</section>
<section id="cards" class="hidden">
 <div class="card"><h2>本月信用卡消费</h2><div class="big" style="font-size:27px" id="cardSum">RM 0.00</div><label>信用卡名称</label><input id="cardName" placeholder="例如 Maybank Visa"><label>消费金额（RM）</label><input id="cardAmount" type="number" min="0" step=".01" placeholder="0.00"><label>消费内容</label><input id="cardNote" placeholder="例如：Shopee、晚餐"><label>日期</label><input id="cardDate" type="date"><button class="primary" id="addCard">＋ 添加消费</button></div>
 <div class="card"><h2>信用卡记录</h2><div id="cardRecords"></div></div>
</section>
<footer><span>MY MONEY · RM</span><div><button class="smallbtn" id="export">导出备份</button> <button class="smallbtn" id="import">导入备份</button><input id="file" type="file" accept=".json,application/json" hidden></div></footer><div class="notice" id="notice" aria-live="polite">资料自动保存在这台设备的浏览器中</div>
<div class="modal hidden" id="modal"><div class="sheet"><div class="sheethead"><h2 id="formTitle">新增支出</h2><button id="close">✕</button></div><div class="typepick"><button id="pickExpense" class="selected">支出</button><button id="pickIncome">收入</button></div><label>金额（RM）</label><input id="amount" type="number" min="0" step=".01" placeholder="0.00"><label>分类</label><select id="category"></select><label>备注</label><input id="note" placeholder="例如：午餐、薪水"><label>日期</label><input id="date" type="date"><button class="primary" style="width:100%;margin-top:8px" id="save">保存记录</button><p id="error" class="muted" style="font-size:12px"></p></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),KEY='mymoney-v1',expenseCats=['餐饮','交通','购物','日常用品','房屋/账单','娱乐','医疗','其他'],incomeCats=['薪水','津贴','生意收入','兼职','其他'];
let data={entries:[],cards:[],totalBudget:0,budgets:{}},kind='expense';
const today=()=>{let d=new Date(),off=d.getTimezoneOffset();return new Date(d-off*60000).toISOString().slice(0,10)};
const monthNow=today().slice(0,7),fmt=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}),monthOf=d=>d.slice(0,7),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));$('notice').textContent='已自动保存到这台 iPhone';}catch(e){$('notice').textContent='储存空间不足，请先导出备份';}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.entries)&&Array.isArray(x.cards))data={...data,...x};}catch(e){$('notice').textContent='读取资料失败；请尝试导入备份';}}
function selectedMonth(){return $('month').value}
function current(){return data.entries.filter(x=>monthOf(x.date)===selectedMonth())}
function line(x,withDelete=false,type='entry'){return `<div class="row"><div style="min-width:0"><b>${esc(x.note||x.category||x.name||'记录')}</b><small>${esc(x.date)} · ${esc(x.category||x.name||'信用卡')}</small></div><span class="amount ${x.type==='income'?'green':'red'}">${x.type==='income'?'+':'−'} ${fmt(x.amount)}</span>${withDelete?`<button class="smallbtn" data-delete="${type}" data-id="${esc(x.id)}">删除</button>`:''}</div>`}
function render(){let e=current(),inc=sum(e.filter(x=>x.type==='income'),x=>x.amount),out=sum(e.filter(x=>x.type==='expense'),x=>x.amount);
$('balance').textContent=fmt(inc-out);$('income').textContent=fmt(inc);$('expense').textContent=fmt(out);
let max=Math.max(inc,out,1);$('chart').innerHTML=`<div class="chartcol"><b>${fmt(inc)}</b><div class="bars"><div class="baritem incomeBar" style="height:${Math.max(3,inc/max*90)}px"></div></div>收入</div><div class="chartcol"><b>${fmt(out)}</b><div class="bars"><div class="baritem expenseBar" style="height:${Math.max(3,out/max*90)}px"></div></div>支出</div>`;
let groups={};e.filter(x=>x.type==='expense').forEach(x=>groups[x.category]=(groups[x.category]||0)+x.amount);let total=out;
$('categories').innerHTML=Object.keys(groups).length?Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="categoryline"><div class="row"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar"><span style="width:${total?100*v/total:0}%"></span></div></div>`).join(''):'还没有记录';
let sorted=e.slice().sort((a,b)=>b.date.localeCompare(a.date));$('recent').innerHTML=sorted.slice(0,5).map(x=>line(x)).join('')||'暂无记录';$('records').innerHTML=sorted.map(x=>line(x,true)).join('')||'<p class="muted">暂无记录</p>';$('count').textContent=`· ${e.length} 笔`;
$('totalBudget').value=data.totalBudget||'';$('budgetInfo').textContent=data.totalBudget?`${fmt(out)} / ${fmt(data.totalBudget)} · ${Math.round(out/data.totalBudget*100)}% 已使用`:'设置预算后会显示使用进度';$('totalBar').style.width=data.totalBudget?Math.min(100,out/data.totalBudget*100)+'%':'0%';
$('budgetCats').innerHTML=expenseCats.map(c=>{let v=sum(e.filter(x=>x.type==='expense'&&x.category===c),x=>x.amount),b=data.budgets[c]||0;return `<div style="margin:12px 0"><div class="row"><b>${c}</b><span class="muted">${fmt(v)}${b?' / '+fmt(b):''}</span></div><div style="display:flex;gap:7px"><input data-bval="${c}" type="number" min="0" placeholder="预算 RM" value="${b||''}" style="margin:4px 0"><button class="smallbtn" data-bsave="${c}">保存</button></div>${b?`<div class="bar"><span style="width:${Math.min(100,v/b*100)}%"></span></div>`:''}</div>`}).join('');
let cc=data.cards.filter(x=>monthOf(x.date)===selectedMonth());$('cardSum').textContent=fmt(sum(cc,x=>x.amount));$('cardRecords').innerHTML=cc.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><div><b>${esc(x.name)}</b><small>${esc(x.note)} · ${esc(x.date)}</small></div><b>${fmt(x.amount)}</b><button class="smallbtn" data-delete="card" data-id="${esc(x.id)}">删除</button></div>`).join('')||'<p class="muted">暂无信用卡记录</p>';
}
function openForm(k){kind=k;$('formTitle').textContent=k==='expense'?'新增支出':'新增收入';$('pickExpense').classList.toggle('selected',k==='expense');$('pickIncome').classList.toggle('selected',k==='income');$('category').innerHTML=(k==='expense'?expenseCats:incomeCats).map(c=>`<option>${c}</option>`).join('');$('amount').value='';$('note').value='';$('date').value=today();$('error').textContent='';$('modal').classList.remove('hidden')}
$('newExpense').onclick=()=>openForm('expense');$('newIncome').onclick=()=>openForm('income');$('close').onclick=()=>$('modal').classList.add('hidden');$('pickExpense').onclick=()=>openForm('expense');$('pickIncome').onclick=()=>openForm('income');
$('save').onclick=()=>{let amount=Number($('amount').value),date=$('date').value;if(!(amount>0)||!Number.isFinite(amount))return $('error').textContent='请输入有效金额';if(!date)return $('error').textContent='请选择日期';data.entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),type:kind,amount,category:$('category').value,note:$('note').value.trim(),date});persist();$('modal').classList.add('hidden');render()};
$('month').onchange=render;$('saveTotal').onclick=()=>{data.totalBudget=Math.max(0,Number($('totalBudget').value)||0);persist();render()};
$('budgetCats').onclick=e=>{let b=e.target.closest('[data-bsave]');if(!b)return;let c=b.dataset.bsave;data.budgets[c]=Math.max(0,Number($(`[data-bval="${c}"]`).value)||0);persist();render()};
$('addCard').onclick=()=>{let amount=Number($('cardAmount').value),name=$('cardName').value.trim(),date=$('cardDate').value||today();if(!(amount>0))return $('notice').textContent='请输入有效信用卡金额';if(!name)return $('notice').textContent='请输入信用卡名称';data.cards.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),name,amount,date,note:$('cardNote').value.trim()});$('cardAmount').value='';$('cardNote').value='';persist();render()};
document.body.addEventListener('click',e=>{let b=e.target.closest('[data-delete]');if(!b)return;let key=b.dataset.delete==='card'?'cards':'entries';data[key]=data[key].filter(x=>String(x.id)!==b.dataset.id);persist();render()});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));['home','list','budget','cards'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});
$('export').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-money-backup.json';a.click();URL.revokeObjectURL(url);$('notice').textContent='备份文件已导出'};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.entries)||!Array.isArray(x.cards))throw Error();data={...data,...x};persist();render();$('notice').textContent='备份导入成功'}catch{$('notice').textContent='备份文件无效，请检查文件'}e.target.value=''};
let months=[];for(let i=0;i<18;i++){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7))}
$('month').innerHTML=months.map(m=>`<option value="${m}">${new Date(m+'-02').toLocaleDateString('zh-CN',{year:'numeric',month:'long'})}</option>`).join('');$('month').value=monthNow;$('today').textContent=new Date().toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});$('cardDate').value=today();load();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
